  --info-ink:#fbf6e8;--info-ink-muted:#c4d2e6;--info-ink-faint:#a9bcd6;
  --info-gold:#e6c878;--info-accent:#8fbcf0;
  --ink:#1c3d6e;--ink-dark:#0e2348;--ink-body:#1a1308;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-deep:#8a6a2a;--gold-lite:#d4b878;
  --asphalt:#2a2218;--cleared:#1f6f3f;--cleared2:#2d8a52;--stamp-red:#b94a3a;--amber:#f59e0b;
  --font-ui:'IBM Plex Sans Hebrew','Heebo',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Menlo','Courier New',monospace;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--paper);font-family:var(--font-ui);overflow:hidden;overscroll-behavior:none;}
:root{--lsa-foot-h:33px;--lsa-foot-pad:max(8px,calc(env(safe-area-inset-bottom,0px) - 16px));}
#app{height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent 27px,var(--paper-line) 27px,var(--paper-line) 28px);}
@media (min-width:600px){body{background:var(--paper-hi);}}
.spl{position:absolute;inset:0;z-index:3100;background:var(--paper);display:none;flex-direction:column;align-items:center;font-family:var(--font-ui);cursor:pointer;transition:opacity .25s ease;-webkit-tap-highlight-color:transparent}
.spl.show{display:flex}
.spl.out{opacity:0;pointer-events:none}
.spl .sp-logo{display:flex;flex-direction:column;align-items:center;margin:auto 0}
.spl .sp-icon{width:180px;height:180px;border-radius:40px;box-shadow:0 10px 30px rgba(28,61,110,.18);margin-bottom:22px;opacity:0;transform:scale(.85);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1)}
.spl .sp-title{font-size:30px;font-weight:700;color:var(--ink);letter-spacing:.02em;opacity:0;transition:opacity .45s ease}
.spl .sp-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);margin-top:6px;margin-bottom:26px;padding-left:.3em;opacity:0;transition:opacity .45s ease}
.spl .sp-line1{font-size:19px;font-weight:600;color:var(--ink);text-align:center;direction:ltr;height:26px;white-space:nowrap}
.spl .sp-line1 i{display:inline-block;width:2px;height:19px;background:var(--gold);vertical-align:-3px;margin:0 -2px 0 0;opacity:0}
.spl.typing .sp-line1 i{opacity:1;animation:splcaret .7s steps(1) infinite}
@keyframes splcaret{50%{opacity:0}}
.spl .sp-line2{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink-muted);margin-top:8px;direction:ltr;opacity:0;transition:opacity .5s ease}
.spl.k1 .sp-icon{opacity:1;transform:none}
.spl.k2 .sp-title{opacity:1}
.spl.k3 .sp-tag{opacity:1}
.spl.k5 .sp-line2{opacity:1}
.spl .sp-foot{width:100%;box-sizing:border-box;display:flex;justify-content:center;align-items:center;padding:10px 14px;border-top:1px solid var(--gold-lite);font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);direction:rtl}

.spl{display:flex;cursor:default}
.spl .sp-logo{margin:auto 0}
.spl .sp-stamp{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-deep);border:2px solid var(--gold);border-radius:4px;padding:6px 12px 6px calc(12px + .28em);margin-top:30px;transform:rotate(-3deg);opacity:0;transition:opacity .5s ease;background:rgba(200,160,74,.08)}
.spl.k5 .sp-stamp{opacity:1}
.lsa-foot{box-sizing:border-box;flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;direction:ltr;
  height:calc(var(--lsa-foot-h) + var(--lsa-foot-pad));padding:0 12px var(--lsa-foot-pad);margin:0;
  background:var(--paper-hi,#fbf6e8);border-top:1px solid var(--gold-lite,#d4b878);
  font-family:var(--font-mono,var(--mono,'JetBrains Mono',monospace));font-size:9px;font-weight:400;letter-spacing:.04em;line-height:1.2;
  color:var(--ink-faint,#8a7a5a);text-transform:none;text-align:center;position:relative;z-index:5;}
.lsa-foot.sp{position:absolute;left:0;right:0;bottom:0;}
.lsa-foot-ver{grid-column:2;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lsa-foot-ver a{color:inherit;text-decoration:none;}
.lsa-foot-slot{grid-column:1;justify-self:start;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75;font-size:9px;letter-spacing:.04em;background:none;border:0;padding:0;font-family:inherit;color:inherit;}
</style>

<script>
(function(){
  var sp=document.getElementById("spl"), el=document.getElementById("splL1"), L1="Your flight. Your NOTAMs.";
  var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(n){ el.innerHTML=L1.slice(0,n)+"<i></i><span style='visibility:hidden'>"+L1.slice(n)+"</span>"; }
  function at(ms,f){ setTimeout(f,ms); }
  draw(0);
  if(calm){ sp.classList.add("k1","k2","k3","k5"); draw(L1.length); sp.classList.remove("typing"); return; }
  at(60,function(){sp.classList.add("k1");}); at(450,function(){sp.classList.add("k2");}); at(800,function(){sp.classList.add("k3");});
  at(1150,function(){ sp.classList.add("typing"); var i=0; var t=setInterval(function(){ draw(++i); if(i>=L1.length){ clearInterval(t); } },34); });
  at(2400,function(){ sp.classList.remove("typing"); sp.classList.add("k5"); });
})();
</script>
