# AirNotam-ISR - IAA reading test v1.00.001
# Manual only. Runs one visit to IAA and reports. Saves nothing to the repo.
name: IAA reading test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser
        run: |
          npm install playwright --no-save
          npx playwright install --with-deps chromium
      - name: One visit to IAA
        run: node .github/scripts/iaa-test.mjs
      - name: Keep the page and picture for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iaa-test-result
          path: |
            iaa-page.html
            iaa-result.png
          if-no-files-found: ignore
          retention-days: 3
